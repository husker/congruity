[project]
name = "congruity"
version = "0.0.0"
description = "Verification-first cross-literature connection finder for CS algorithmic equivalences."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "cma>=4.4.4",
    "jax>=0.10.1",
    "numpy>=2.4.6",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "requests>=2.32",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["experiments/auto"]

[tool.ruff.lint]
# Keep correctness checks stable when Ruff changes its default rule selection.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: calibration/convergence tests that run real WL (deselect with -m 'not slow')",
]
